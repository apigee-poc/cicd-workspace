# Release pipeline for non-prod (Cloud Build, project ci-cd-511313).
# Trigger: push to main (every merged PR). Service account: cb-deploy-nonprod.
# Flow: stamp commit → lint → create versioned KVM → deploy dev (new revision N)
#       → test dev (rollback on failure)
#       → create versioned KVM in staging → promote the SAME revision N to staging
#       → test staging (rollback on failure).
# Any failing step stops the pipeline: staging is only touched if dev passed.
# KVM versioning: each commit gets its own KVM (hello-v1-config-<SHA>).
# Rollback is automatic — the previous proxy revision references its own KVM.

substitutions:
  _ORG: apigee-nonprod-511322
  _PROXY: hello-v1

steps:
  - id: install
    name: node:22
    entrypoint: npm
    args: ['ci']

  # Traceability: write the commit and build ID into the bundle's description,
  # and stamp the KVM version (short SHA) into KVM policy mapIdentifier attributes.
  - id: stamp-commit
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        PROXY_DIR=src/main/apigee/apiproxies/hello-v1/apiproxy

        # Stamp the proxy description (existing)
        sed -i 's#<Description>.*</Description>#<Description>hello-v1 | commit ${SHORT_SHA} | build ${BUILD_ID}</Description>#' \
          "$PROXY_DIR/hello-v1.xml"

        # Stamp KVM version into all policies that use the placeholder
        find "$PROXY_DIR/policies" -name '*.xml' -exec \
          sed -i "s/__KVM_VERSION__/${SHORT_SHA}/g" {} +

        # Log what was stamped
        echo "Stamped commit ${SHORT_SHA} and KVM version"
        grep '<Description>' "$PROXY_DIR/hello-v1.xml"
        grep -r 'mapIdentifier' "$PROXY_DIR/policies/" || true

  # Quality gate 1
  - id: lint
    name: node:22
    entrypoint: npm
    args: ['run', 'lint']

  # Short-lived token of cb-deploy-nonprod, kept only inside this build's workspace
  - id: token
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['-c', 'gcloud auth print-access-token > /workspace/.token']

  # Record currently deployed dev revision before deploying new revision (for rollback)
  - id: record-prev-dev
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['scripts/get-deployed-revision.sh', '${_ORG}', 'dev', '${_PROXY}', 'prev_dev_revision.txt']

  # Create versioned KVM in dev BEFORE deploying (so the proxy can read it on startup)
  - id: create-kvm-dev
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['scripts/create-versioned-kvm.sh', '${_ORG}', 'dev', '${SHORT_SHA}']

  # Import the bundle as a new revision and deploy it to dev
  - id: deploy-dev
    name: maven:3.9.9-eclipse-temurin-17
    entrypoint: bash
    args: ['-c', 'mvn -B -f src/main/apigee/apiproxies/hello-v1/pom.xml clean install -Pdev "-Dbearer=$$(cat /workspace/.token)"']

  - id: wait-dev
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['scripts/wait-for-deployment.sh', '${_ORG}', 'dev', '${_PROXY}']

  # Quality gate 2 on dev
  - id: test-dev
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        npm run test:dev || { echo "Dev tests failed!" >&2; touch /workspace/dev_test_failed; }

  # Rollback dev if test-dev failed.
  # No KVM rollback needed: the previous proxy revision references its own
  # versioned KVM (hello-v1-config-<prev-SHA>) which still exists.
  - id: check-dev-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ -f /workspace/dev_test_failed ]; then
          echo "Post-deploy tests failed on dev! Initiating rollback..."
          bash scripts/rollback.sh "${_ORG}" dev "${_PROXY}" "$$(cat prev_dev_revision.txt)" "$$(cat dev_revision.txt)"
          echo "Pipeline halted: dev tests failed and environment was rolled back." >&2
          exit 1
        fi
        echo "Dev tests passed."

  # Record currently deployed staging revision before promotion (for rollback)
  - id: record-prev-staging
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['scripts/get-deployed-revision.sh', '${_ORG}', 'staging', '${_PROXY}', 'prev_staging_revision.txt']

  # Create versioned KVM in staging (same SHA, staging-specific values from staging/kvms/)
  - id: create-kvm-staging
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['scripts/create-versioned-kvm.sh', '${_ORG}', 'staging', '${SHORT_SHA}']

  # Promotion: deploy the revision that passed in dev to staging (no new import)
  - id: promote-staging
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['-c', 'bash scripts/deploy-revision.sh ${_ORG} staging ${_PROXY} "$$(cat dev_revision.txt)"']

  - id: wait-staging
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args: ['scripts/wait-for-deployment.sh', '${_ORG}', 'staging', '${_PROXY}']

  # Quality gate 2 on staging
  - id: test-staging
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        npm run test:staging || { echo "Staging tests failed!" >&2; touch /workspace/staging_test_failed; }

  # Rollback staging if test-staging failed (same logic — old revision has its own KVM)
  - id: check-staging-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ -f /workspace/staging_test_failed ]; then
          echo "Post-deploy tests failed on staging! Initiating rollback..."
          bash scripts/rollback.sh "${_ORG}" staging "${_PROXY}" "$$(cat prev_staging_revision.txt)" "$$(cat staging_revision.txt)"
          echo "Pipeline halted: staging tests failed and environment was rolled back." >&2
          exit 1
        fi
        echo "Staging tests passed."

  - id: summary
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        echo "commit:           ${COMMIT_SHA}"
        echo "build:            ${BUILD_ID}"
        echo "kvm version:      ${SHORT_SHA}"
        echo "dev revision:     $$(cat dev_revision.txt)"
        echo "staging revision: $$(cat staging_revision.txt)"

options:
  # Required when a build runs as a user-specified service account
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
